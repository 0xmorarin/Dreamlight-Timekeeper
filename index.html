<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDV Save Timing Tools</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
<header>
<h1>DDV Save Timing Tools <small>β</small></h1>
<div class="file-controls">
<label for="save-file">セーブファイル</label>
<input id="save-file" type="file" aria-label="セーブファイルを選択">
<button id="download-backup" disabled>原本を保存</button>
</div>
</header>
<p id="status" role="status" aria-live="polite">初期化しています…</p>
<div id="save-info" class="save-info">セーブ未読込み</div>
<nav id="tabs" aria-label="日時カテゴリ"></nav>
<section class="work">
<div class="heading">
<h2 id="current-category">自動発生・スポーン</h2>
<select id="world-filter" aria-label="エリア"><option value="all">全エリア</option></select>
 <input id="filter-input" type="search" placeholder="名前・IDで検索" aria-label="名前またはIDで検索">
</div>
<div class="controls">
<label for="time-mode">指定日時</label>
<select id="time-mode">
<option value="now">現在時刻</option>
<option value="custom">任意の日時</option>
</select>
<input id="custom-time" type="datetime-local" aria-label="任意の日時" disabled>
<button id="bulk" disabled>表示中の対象を確認</button>
</div>
<div id="records" class="records"></div>
<section class="preview">
<h3>確認内容</h3>
<div id="preview">対象を選択してください。</div>
</section>
</section>
<footer>読取り専用 · 元のセーブは変更しません · Switch v1.25.3 / schema 626</footer>
</main>
<script>
(()=>{
const status=document.getElementById('status');
if(location.protocol==='file:'){
status.textContent='直接開いた場合は動作しません。展開先で py -m http.server 8000 を実行し、http://localhost:8000/ を開いてください。';
status.className='error';
document.getElementById('save-file').disabled=true;
return;
}
const failure=message=>{if(!window.__ddvBooted){status.textContent=message;status.className='error';}};
window.addEventListener('error',e=>failure('画面の初期化に失敗しました: '+(e.message||'スクリプトを確認してください')));
window.addEventListener('unhandledrejection',e=>failure('画面の初期化に失敗しました: '+(e.reason?.message||'処理エラー')));
setTimeout(()=>failure('初期化できませんでした。サーバー起動とJavaScriptの読込みを確認してください。'),7000);
})();
</script>
<script type="module" src="./src/app.mjs"></script>
</body>
</html>
