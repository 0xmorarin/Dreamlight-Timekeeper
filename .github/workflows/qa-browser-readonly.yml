name: 05 QR Chromium Read-only Acceptance

on:
  pull_request:
    paths:
      - 'tests/qa-browser-readonly.smoke.mjs'
      - '.github/workflows/qa-browser-readonly.yml'
      - 'src/app.mjs'
      - 'src/worker.mjs'
      - 'src/reader.mjs'
      - 'src/core/**'
      - 'index.html'
      - 'styles.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test local synthetic save flow in actual Chromium
        run: node tests/qa-browser-readonly.smoke.mjs
