name: Browser UI icons smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual UI images and read-only flow in Chromium
        run: node tests/browser-ui.smoke.mjs
      - name: Verify 200% icons, trusted keyboard input and synthetic save loading (5 independent runs)
        run: |
          for sample in 1 2 3 4 5; do
            echo "=== independent Chromium zoom + trusted keyboard file input sample ${sample}/5 ==="
            node tests/browser-asset-zoom.smoke.mjs
          done
