name: 05 QR Round 5 Independent Integrated HEAD Acceptance

on:
  pull_request:
    paths:
      - 'qa/round3/**'
      - 'qa/round4/**'
      - 'qa/round5/**'
      - '.github/workflows/qa-round3-integrated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-negative-and-full-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout independent QA PR9 tests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-source
          persist-credentials: false
      - name: Checkout exact CTRL PR11 integration, not its moving branch
        uses: actions/checkout@v4
        with:
          ref: 86d8bdf8cab38826a8b7a06fdddf8b98b3569c9e
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact production HEAD and install QA-only synthetic assertions
        run: |
          test "$(git -C target rev-parse HEAD)" = "86d8bdf8cab38826a8b7a06fdddf8b98b3569c9e"
          cp qa-source/qa/round3/integration.test.mjs target/tests/qa-round3-integration.test.mjs
          cp qa-source/qa/round4/integration.test.mjs target/tests/qa-round4-integration.test.mjs
          cp qa-source/qa/round5/integration.test.mjs target/tests/qa-round5-integration.test.mjs
      - name: Install offline lossless WebP CLI required by existing ASSET importer test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp imagemagick
      - name: Independently run impact-scoped CORE/TIME/ASSET plus Round5 QA negative suites
        run: |
          cd target
          node --test tests/p1g-json-safety.test.mjs tests/p1g-envelope-audit.test.mjs tests/synthetic-p1g-timing-roundtrip.test.mjs tests/timing-native-semantics.test.mjs tests/steam-ui-provenance.test.mjs tests/icon-import.integration.mjs tests/qa-round3-integration.test.mjs tests/qa-round4-integration.test.mjs tests/qa-round5-integration.test.mjs

  integrated-chromium-sessions-and-native-zoom:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Checkout QA tests only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-source
          persist-credentials: false
      - name: Checkout exact CTRL PR11 integration
        uses: actions/checkout@v4
        with:
          ref: 86d8bdf8cab38826a8b7a06fdddf8b98b3569c9e
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chromium runner on isolated synthetic integration only
        run: |
          test "$(git -C target rev-parse HEAD)" = "86d8bdf8cab38826a8b7a06fdddf8b98b3569c9e"
          cp qa-source/qa/round2/web-browser.mjs target/tests/qa-round3-session.smoke.mjs
          cp qa-source/qa/round3/native-zoom.smoke.mjs target/tests/qa-round3-native-zoom.smoke.mjs
          cd target
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reuse prior independent A→B session negative evidence (unchanged WEB source)
        run: |
          cd target
          echo 'Unchanged WEB src/worker.mjs and src/app.mjs: previous fixed integrated HEAD independent session PASS reused; Native zoom below exercises current combined icon+backup.'
      - name: Assert actual browser-native 200% tab zoom, missing icon fallback and session UX
        run: |
          cd target
          node tests/qa-round3-native-zoom.smoke.mjs

  integrated-asset-python-private-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 86d8bdf8cab38826a8b7a06fdddf8b98b3569c9e
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact integrated product HEAD and install private negative test only
        run: |
          test "$(git -C target rev-parse HEAD)" = "86d8bdf8cab38826a8b7a06fdddf8b98b3569c9e"
          cp qa-source/qa/round5/assets_private_trial_test.py target/tests/qa_round5_asset_private_test.py
      - name: Install independent RGBA comparators
        run: |
          python -m pip install Pillow lz4
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if ! command -v magick >/dev/null; then
            mkdir -p "$RUNNER_TEMP/qr-bin"
            ln -s "$(command -v convert)" "$RUNNER_TEMP/qr-bin/magick"
            echo "$RUNNER_TEMP/qr-bin" >> "$GITHUB_PATH"
          fi
      - name: Independently reject HOLD publication and verify synthetic transparent RGBA
        run: |
          cd target
          python -m unittest discover -s tests -p 'qa_round5_asset_private_test.py' -v
