name: 05 QR pre-Rust actual Chromium large-save baseline
on:
  push:
    branches: [qa/large-save-browser-baseline-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  large-save-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: ['16', '64', '100', '200', 'gridcap']
    env:
      DDV_QA_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable PR11 product baseline and QA-only changes
        shell: bash
        run: |
          set -eu
          git rev-parse HEAD
          git cat-file -e 393222e7832461ef5fea847b6fff475fedc45017^{commit}
          test -z "$(git diff --name-only 393222e7832461ef5fea847b6fff475fedc45017 HEAD -- src tests data assets scripts index.html styles.css)"
          node --check qa/large-save/chromium-worker-baseline.mjs
      - name: Install pinned Playwright and real Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Isolated synthetic actual product Worker capacity diagnosis
        run: node qa/large-save/chromium-worker-baseline.mjs
      - name: Upload redacted metrics only (no synthetic or private save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-large-save-${{ matrix.case }}
          path: qa-large-save-${{ matrix.case }}.json
          if-no-files-found: warn
          retention-days: 14
