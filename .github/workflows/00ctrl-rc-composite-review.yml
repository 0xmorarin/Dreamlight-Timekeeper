name: 00 CTRL Composite Read-Only RC Review (no deploy)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'contracts/web-readonly-*.json'
      - 'data/web-text-item-types-v1253.json'
      - 'scripts/stage-sveltekit-review-only.mjs'
      - 'scripts/audit-sveltekit-build.mjs'
      - 'tests/ctrl-sveltekit-review-stage.test.mjs'
      - 'tests/web-readonly-rc-contract.test.mjs'
      - '.github/workflows/00ctrl-rc-composite-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-compiled-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned project dependencies without publishing
        run: npm install --no-audit --no-fund
      - name: Check READ Worker denial and Svelte source
        run: |
          node --test tests/web-readonly-rc-contract.test.mjs
          npm run check
      - name: Build exact text-only RC configuration
        env:
          BASE_PATH: /Dreamlight-Timekeeper
          VITE_WEB_READONLY_RC: '1'
        run: |
          npm run build
          node scripts/audit-sveltekit-build.mjs build .release-audit/ctrl-combined-build-inventory.json
          node -e "const c=require('./contracts/web-readonly-rc-release-v1.json'); if(c.status!=='DRAFT_NEVER_DEPLOY'||c.releaseGates.publicReleaseApproved!==false||c.product.writerEnabled!==false||c.product.editedCopyOutputEnabled!==false) process.exit(23)"
      - name: Independently verify CTRL stage source security and output after build
        run: node --test tests/ctrl-sveltekit-review-stage.test.mjs
      - name: Independently stage compiled bytes outside checkout, no upload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-sveltekit-review-only.mjs build "${RUNNER_TEMP}/timekeeper-readonly-review-${GITHUB_RUN_ID}"
          echo 'REVIEW_ONLY: no artifact upload, deployment, media-rights or Writer authorization'
