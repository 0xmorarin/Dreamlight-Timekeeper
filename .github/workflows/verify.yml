name: Verify Timekeeper

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare audited local SvelteKit test fixture (never deploy)
        env:
          BASE_PATH: /Dreamlight-Timekeeper
          VITE_WEB_READONLY_RC: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s build/index.html
      - name: Run tests and icon integrity checks
        run: npm test
      - name: Install lossless image verification tools
        run: sudo apt-get update && sudo apt-get install -y webp imagemagick
      - name: Verify real VP8L pixel round trip
        run: npm run test:icon-import
      - name: Verify UnityFS item-source analysis helper
        run: |
          python -m pip install lz4 Pillow
          python -m unittest discover -s tests -p 'steam_icon_audit_test.py' -v
          python -m unittest discover -s tests -p 'steam_ui_atlas_test.py' -v
          python -m py_compile scripts/audit-steam-ui-atlas.py
